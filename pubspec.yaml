name: sutms
description: Smart University Transport Management System (SUTMS)
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.9.4
  firebase_storage: ^11.7.7
  google_maps_flutter: ^2.6.1
  geolocator: ^10.1.0
  provider: ^6.1.2
  go_router: ^13.2.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_local_notifications: ^16.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
